requires-python = ">=3.12"

dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "SQLAlchemy==2.0.51",
    "psycopg2-binary==2.9.12",
    "alembic==1.19.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.2",
    "python-jose==3.5.0",
    "passlib==1.7.4",
    "bcrypt==4.3.0",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
    "openai==3.11.0",
    "resend==2.53.1",
    "slowapi==0.1.10",
    "pypdf==6.15.0",
    "requests==2.34.2",
    "vercel==0.12.2"
